spring:
  application:
    name: orbit-mobile-api
  datasource:
    url: jdbc:h2:mem:orbit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

demo:
  auth:
    username: ${DEMO_USERNAME:demo}
    password: ${DEMO_PASSWORD:Demo123!}
