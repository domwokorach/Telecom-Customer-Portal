# Optional GitHub Pages deploy for the zero-install fictional preview.
# To activate: push to the main branch, then set Settings > Pages > Source to GitHub Actions.
name: Publish demo preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./preview
      - id: deployment
        uses: actions/deploy-pages@v4
