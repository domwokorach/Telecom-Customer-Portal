<div class="stat-grid"><div class="stat-card"><div class="stat-top"><span class="stat-icon stat-icon-purple">${icon('activity',20)}</span><span class="stat-trend">This month</span></div><div class="stat-value">${remaining()===null?'∞':remaining().toFixed(1)}<small>${remaining()===null?'data':'GB'}</small></div><p>Data remaining</p><div class="stat-foot"><span class="subtle-dot"></span>${remaining()===null?'Unlimited allowance':state.used+' GB used so far'}</div></div><div class="stat-card"><div class="stat-top"><span class="stat-icon stat-icon-coral">${icon('credit',20)}</span><span class="stat-trend">Monthly</span></div><div class="stat-value">${money(plan().price)}</div><p>Next bill estimate</p><div class="stat-foot">${icon('calendar',15)} Due ${state.renewal}</div></div><div class="stat-card"><div class="stat-top"><span class="stat-icon stat-icon-teal">${icon('calendar',20)}</span><span class="stat-trend">Billing cycle</span></div><div class="stat-value">${state.days}<small>days</small></div><p>Until renewal</p><div class="stat-foot">${icon('checked',15)} Your account is up to date</div></div></div>
<div class="dashboard-grid"><section class="panel data-panel">${panelHeading('YOUR ALLOWANCE','Data usage',link('View details','usage'))}<div class="usage-content">${ring()}<div class="usage-stats"><div><span>Remaining data</span><strong>${remaining()===null?'Unlimited':remaining().toFixed(1)+' GB'}</strong></div><div class="tiny-divider"></div><div><span>Plan allowance</span><strong>${plan().limit===null?'Unlimited':plan().limit+' GB'}</strong></div><div class="cycle-note">${icon('refresh',15)} Resets ${state.renewal}</div></div></div></section>
<section class="panel plan-panel">${panelHeading('CURRENT SUBSCRIPTION','Your plan','<span class="active-tag"><span></span> Active</span>')}<div class="plan-icon">${icon('sim',26)}</div><h3>${plan().name} <span>5G</span></h3><p class="plan-description">${plan().description}</p><div class="plan-quick-details"><span>${icon('wifi',16)} ${plan().limit===null?'Unlimited data':plan().limit+' GB data'}</span><span>${icon('phone',16)} Unlimited calls & texts</span></div><div class="plan-bottom"><div><strong>${money(plan().price)}</strong><span>/ month</span></div><button class="soft-button" data-nav="plans">Manage plan ${icon('right',16)}</button></div></section>
<section class="panel trend-panel">${panelHeading('6-MONTH TREND','Your data at a glance',`<span class="muted-chip">${icon('bars',15)} GB used</span>`)}${chart()}</section>
<section class="panel bills-panel">${panelHeading('BILLING HISTORY','Recent bills',link('View all','bills'))}<div class="recent-bills">${state.invoices.slice(0,3).map(([id,period,date,amount])=>`<div class="recent-bill"><div class="bill-icon">${icon('receipt',19)}</div><div class="bill-copy"><strong>${period}</strong><span>${id}</span></div><div class="bill-total"><strong>${money(amount)}</strong>${status('PAID')}</div></div>`).join('')}</div></section></div>
<div class="security-note">${icon('shield',18)}<span>Demo environment with fictional customer information. No real payments or account changes.</span><span>Built with React + TypeScript (see source)</span></div></div>`;
const usage=()=>`<div class="page-content"><div class="inner-hero"><div><span class="eyebrow">MONTHLY DATA REPORT</span><h2>Know your data. Own your month.</h2><p>Keep tabs on how much you've used and where it goes.</p></div><div class="hero-badge">${icon('calendar',17)} Current billing period</div></div><div class="two-col"><section class="panel">${panelHeading('MONTHLY ALLOWANCE','Current cycle')}<div class="usage-detail">${ring()}<div class="usage-detail-info"><div><span>Used this month</span><strong>${state.used} GB</strong></div><div><span>Still available</span><strong>${remaining()===null?'Unlimited':remaining().toFixed(1)+' GB'}</strong></div><div><span>Resets on</span><strong>${state.renewal}</strong></div></div></div><div class="usage-alert">${icon('checked',18)} ${remaining()===null?'Unlimited mobile data on this plan.':remaining()>0?'You are within your monthly allowance.':'Allowance reached.'}</div></section><section class="panel">${panelHeading('USAGE BREAKDOWN','Where your data goes')}<div class="category-list">${state.categories.map(([name,val,col])=>`<div class="category-row"><div class="category-meta"><span><i style="background:${col}"></i>${name}</span><strong>${val.toFixed(1)} GB</strong></div><div class="category-track"><div style="background:${col};width:${val/state.used*100}%"></div></div></div>`).join('')}</div><p class="helper">Illustrative categories; not device-level tracking.</p></section></div><section class="panel">${panelHeading('LAST SIX MONTHS','Monthly usage trend')}${chart()}</section></div>`;
const bills=()=>`<div class="page-content"><div class="bill-summary-grid"><div class="billing-highlight"><span class="eyebrow">NEXT ESTIMATED PAYMENT</span><strong>${money(plan().price)}</strong><span>Due ${state.renewal}</span><div class="highlight-decoration"></div></div><section class="panel summary-card"><span class="eyebrow">YOUR PAYMENT STATUS</span><div class="summary-status">${icon('checked',27)} All caught up</div><p>Your sample account has no outstanding balance.</p></section></div><section class="panel">${panelHeading('YOUR STATEMENTS','Invoice history')}<div class="table-wrap"><table class="invoice-table"><thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.invoices.map(([id,period,date,amount])=>`<tr><td><strong>${period}</strong><small>${id}</small></td><td>${date}</td><td class="money-cell">${money(amount)}</td><td>${status('PAID')}</td><td><button class="download-btn" data-invoice="${id}" aria-label="Download ${period} fictional invoice">${icon('download',17)} <span>Download</span></button></td></tr>`).join('')}</tbody></table></div><p class="helper invoice-helper">Downloads are fictional plain-text examples, not genuine invoices.</p></section></div>`;
const plans=()=>`<div class="page-content"><div class="inner-hero"><div><span class="eyebrow">FLEXIBLE PLANS</span><h2>A plan that moves with you.</h2><p>Compare plans and explore a simulated switch.</p></div><div class="hero-badge">${icon('zap',17)} Fast 5G connectivity</div></div><div class="plans-grid">${state.plans.map(p=>`<article class="offer-card ${state.plan===p.id?'selected':''}">${state.plan===p.id?`<div class="current-ribbon">${icon('check',14)} CURRENT PLAN</div>`:''}<div class="offer-top"><div class="offer-symbol">${icon(p.id==='unlimited'?'spark':p.id==='plus'?'zap':'sim',22)}</div><h3>${p.name}</h3><p>${p.description}</p></div><div class="offer-price">${money(p.price)}<small>/month</small></div><div class="offer-data">${p.limit===null?'Unlimited':p.limit+' GB'} <small>data</small></div><div class="offer-divider"></div><ul>${p.perks.map(perk=>`<li>${icon('check',16)}${perk}</li>`).join('')}</ul><button class="${state.plan===p.id?'current-plan-button':'offer-button'}" ${state.plan===p.id?'disabled':''} data-plan="${p.id}">${state.plan===p.id?'Your current plan':'Choose this plan'} ${state.plan!==p.id?icon('right',17):''}</button></article>`).join('')}</div><div class="footnote">${icon('shield',18)} Plan changes are simulated and do not affect a real phone account.</div></div>`;
const support=()=>`<div class="page-content"><div class="support-hero"><div class="support-hero-icon">${icon('headphones',30)}</div><div><span class="eyebrow">SUPPORT CENTRE</span><h2>How can we help you today?</h2><p>Have a question? Log a request and track its status.</p></div><button class="primary-button" data-toggle-ticket>${icon(ticketForm?'close':'plus',18)} ${ticketForm?'Close form':'New support request'}</button></div>${ticketForm?`<section class="panel support-form-panel">${panelHeading('TELL US WHAT’S HAPPENING','Create a support request')}<form id="support-form" class="stacked-form"><div class="form-grid"><label>Subject<input name="subject" required minlength="3" maxlength="100" placeholder="A short summary"/></label><label>Category<select name="category"><option>Technical support</option><option>Billing</option><option>Plan & roaming</option><option>Other</option></select></label></div><label>Message<textarea name="message" required minlength="10" maxlength="1000" rows="4" placeholder="Tell us more about your request..."></textarea></label><button class="primary-button form-submit" type="submit">Submit request ${icon('right',17)}</button></form></section>`:''}<section class="panel">${panelHeading('TICKET HISTORY','Your support requests',`<span class="count-badge">${state.tickets.length} requests</span>`)}<div class="ticket-list">${state.tickets.map(t=>`<div class="ticket"><div class="ticket-icon">${icon('headphones',19)}</div><div class="ticket-body"><div class="ticket-title"><strong>${esc(t.subject)}</strong>${status(t.status)}</div><p>${esc(t.message)}</p><div class="ticket-meta"><span>#${t.id}</span><span>${esc(t.category)}</span><span>${esc(t.createdAt)}</span></div></div></div>`).join('')}</div></section></div>`;
const settings=()=>`<div class="page-content"><div class="settings-grid"><section class="panel">${panelHeading('YOUR PROFILE','Personal information')}<div class="settings-avatar">${esc(state.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}<span>${icon('check',12)}</span></div><form id="settings-form" class="stacked-form"><label>Full name<input name="name" required minlength="2" maxlength="100" value="${esc(state.name)}"/></label><label>Email address<input name="email" type="email" required value="${esc(state.email)}"/></label><label>Mobile number<input readonly value="${state.phone}" class="read-only"/><small>Demo mobile number cannot be changed.</small></label><button type="submit" class="primary-button form-submit">Save changes ${icon('check',17)}</button></form></section><div class="setting-side"><section class="panel">${panelHeading('MEMBERSHIP','Account details')}<div class="setting-detail"><span>Member since</span><strong>January 2024</strong></div><div class="setting-detail"><span>Account number</span><strong>ORB-100041</strong></div><div class="setting-detail"><span>Mobile number</span><strong>${state.phone}</strong></div></section><section class="panel reset-card">${panelHeading('PORTFOLIO MODE','Demo controls')}<p>Reset local changes, including the profile, plan and support tickets.</p><button class="soft-button" data-reset>${icon('refresh',16)} Reset demo data</button></section></div></div></div>`;
const login=()=>`<main class="login-layout"><div class="login-decor"><div class="brand brand-login"><span class="brand-mark"><span></span></span><span class="brand-name">orbit<span class="brand-dot">.</span><small>MOBILE</small></span></div><div class="login-art"><div class="login-art-circle">${icon('signal',65)}</div><h1>All your mobile.<br>One beautiful place.</h1><p>Stay connected, in control, and ahead of your day.</p></div><div class="login-disclaimer">Fictional product concept • Engineering portfolio</div></div><div class="login-content"><div class="login-card"><span class="login-eyebrow">WELCOME TO ORBIT</span><h2>Sign in to your account</h2><p>Explore the interactive customer portal demo.</p><form id="login-form" class="stacked-form"><label>Username<input name="username" required value="demo"/></label><label>Password<input name="password" type="password" required value="Demo123!"/></label><button class="primary-button login-submit">Explore demo ${icon('right',18)}</button></form><div class="demo-credentials">${icon('shield',18)}<span><strong>Demo access:</strong> demo / Demo123!<small>No real customer accounts or personal information.</small></span></div></div></div></main>`;
const modal=()=>{if(!pending)return '';const p=state.plans.find(x=>x.id===pending);return `<div class="modal-backdrop" data-modal-backdrop><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div class="modal-icon">${icon('sim',25)}</div><h2 id="modal-heading">Switch to ${p.name}?</h2><p>Your demo plan will change to <strong>${p.name}</strong> at <strong>${money(p.price)}/month</strong>. No real service or payment is affected.</p><div class="modal-actions"><button class="soft-button" data-cancel>Cancel</button><button class="primary-button" data-confirm>Confirm change ${icon('right',16)}</button></div></div></div>`};
const main=()=>{if(!loggedIn)return login();const initials=state.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();return `<div class="app-shell"><div class="mobile-backdrop ${opened?'show':''}" data-close-menu></div><aside class="sidebar ${opened?'open':''}"><div class="brand"><span class="brand-mark"><span></span></span><span class="brand-name">orbit<span class="brand-dot">.</span><small>MOBILE</small></span></div><div class="account-tag"><span class="account-tag-icon">${icon('sim',18)}</span><span><strong>Personal account</strong><small>Customer portal</small></span>${icon('down',15)}</div><p class="sidebar-label">WORKSPACE</p><nav class="nav-list" aria-label="Main navigation">${menus.map(([id,text,sym])=>`<button class="nav-item ${current===id?'active':''}" data-nav="${id}" ${current===id?'aria-current="page"':''}>${icon(sym,19)}<span>${text}</span>${current===id?'<span class="active-marker"></span>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="support-box"><div class="support-icon">${icon('headphones',20)}</div><strong>Need a hand?</strong><p>Our support team is always here to help.</p><button data-nav="support">Get support ${icon('external',15)}</button></div><button class="signout" data-logout>${icon('logout',18)} Sign out</button><div class="sidebar-footer">© 2026 Orbit Mobile <span>Portfolio demo</span></div></div></aside><div class="app-main"><header class="topbar"><div class="crumb"><button class="mobile-menu icon-button" aria-label="Open menu" data-open-menu>${icon('menu',22)}</button><span>My account</span>${icon('chevron',14)}<strong>${headings[current][0]}</strong></div><div class="top-actions"><span class="live-pill"><span></span> All systems operational</span><button class="icon-button desktop-help" aria-label="Help" data-nav="support">${icon('help',20)}</button><button class="profile-chip" data-nav="settings"><span class="avatar">${esc(initials)}</span><span class="profile-name">${esc(state.name)}<small>My account</small></span>${icon('down',15)}</button></div></header><main class="main-content"><div class="page-heading"><div><span class="eyebrow">ORBIT MOBILE / YOUR ACCOUNT</span><h1>${headings[current][0]}</h1><p>${headings[current][1]}</p></div><div class="heading-meta">${icon('calendar',17)} November 2026</div></div>${({overview,usage,bills,plans,support,settings})[current]()}<footer class="main-footer"><span>© 2026 Orbit Mobile — Fictional portfolio experience</span><span>Crafted for clarity, accessibility & performance.</span></footer></main></div>${modal()}${notice?`<div class="toast" role="status">${icon('checked',19)}${esc(notice)}<button aria-label="Dismiss" data-dismiss>${icon('close',15)}</button></div>`:''}</div>`;};
const root=document.getElementById('root');
function render(){root.innerHTML=main()}
function notify(msg){notice=msg;render();setTimeout(()=>{if(notice===msg){notice='';render()}},4000)}
root.addEventListener('click',e=>{
  const button=e.target.closest('[data-nav],[data-plan],[data-confirm],[data-cancel],[data-logout],[data-open-menu],[data-close-menu],[data-toggle-ticket],[data-reset],[data-invoice],[data-dismiss]');
  if(!button){if(e.target.matches('[data-modal-backdrop]')){pending=null;render()}return}
  if(button.hasAttribute('data-nav')){current=button.dataset.nav;opened=false;render();window.scrollTo(0,0)}
  else if(button.hasAttribute('data-plan')){if(button.dataset.plan!==state.plan){pending=button.dataset.plan;render()}}
  else if(button.hasAttribute('data-confirm')){state.plan=pending;pending=null;store();notify('Your demo plan has been updated.')}
  else if(button.hasAttribute('data-cancel')){pending=null;render()}
  else if(button.hasAttribute('data-logout')){loggedIn=false;render()}
  else if(button.hasAttribute('data-open-menu')){opened=true;render()}
  else if(button.hasAttribute('data-close-menu')){opened=false;render()}
  else if(button.hasAttribute('data-toggle-ticket')){ticketForm=!ticketForm;render()}
  else if(button.hasAttribute('data-reset')){state=structuredClone(seed);store();notify('Demo data restored.')}
  else if(button.hasAttribute('data-invoice')){const row=state.invoices.find(x=>x[0]===button.dataset.invoice);const txt=['ORBIT MOBILE — DEMO INVOICE','Fictional example. Not a real invoice.','',`Invoice: ${row[0]}`,`Customer: ${state.name}`,`Period: ${row[1]}`,`Date: ${row[2]}`,`Amount: ${money(row[3])}`,'Status: PAID'].join('\n');const url=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download=row[0]+'-DEMO.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Fictional invoice downloaded.')}
  else if(button.hasAttribute('data-dismiss')){notice='';render()}
});
root.addEventListener('submit',e=>{
  if(e.target.id==='support-form'){e.preventDefault();const data=new FormData(e.target);state.tickets.unshift({id:Math.max(...state.tickets.map(t=>t.id))+1,subject:String(data.get('subject')).trim(),message:String(data.get('message')).trim(),category:String(data.get('category')),status:'OPEN',createdAt:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})});store();ticketForm=false;notify('Support request created.')}
  if(e.target.id==='settings-form'){e.preventDefault();const data=new FormData(e.target);state.name=String(data.get('name')).trim();state.email=String(data.get('email')).trim();store();notify('Your profile has been saved.')}
  if(e.target.id==='login-form'){e.preventDefault();const data=new FormData(e.target);if(data.get('username')==='demo'&&data.get('password')==='Demo123!'){loggedIn=true;render()}else{notify('Please use demo / Demo123!')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pending){pending=null;render()}});
render();
})();
</script></body></html>
